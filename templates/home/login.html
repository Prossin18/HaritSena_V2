{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HaritSena</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Animation -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Login CSS -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <main class="login-page">

        <!-- Left Side -->
        <section class="login-left" data-aos="fade-up" data-aos-duration="800">
            <div class="login-brand" data-aos="fade-up" data-aos-duration="800">
                <h2>🌱 HaritSena</h2>
                <p>Clean Today, Green Tomorrow</p>
            </div>

            <div class="login-welcome" data-aos="fade-up" data-aos-duration="800" data-aos-delay="150">
                <h1>Welcome 
                    <span>Back!</span>
                </h1>

                <div class="login-green-line"></div>

                <p>
                    Login to your HaritSena account <br>
                    and continue making a difference.
                </p>
            </div>
        </section>

        <!-- Right Side -->
        <section class="login-right">
            <div class="login-heading" data-aos="fade-left" data-aos-duration="900">
                <h1>
                    Login to <span>HaritSena</span>
                </h1>

                <p class="login-subtitle">
                    Glad to see you again! Please login to your account.
                </p>

                <!-- Form -->
                <form class="login-form" autocomplete="off">
                    <!-- Email -->
                    <div class="form-group" data-aos="fade-up" data-aos-delay="150">
                        <label for="username">Username</label>

                        <div class="input-box">
                            <i class="bi bi-person"></i>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                autocomplete="off">
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group" data-aos="fade-up" data-aos-delay="250">
                        <label for="password">Password</label>

                        <div class="input-box">
                            <i class="bi bi-lock"></i>

                            <input type="password" id="password" placeholder="Enter your password" autocomplete="new-password" name="login_name">

                            <i class="bi bi-eye password-toggle"></i>
                        </div>
                    </div>

                    <!-- Remember + Forget -->
                    <div class="login-options">
                        <label class="remember-me">
                            <input type="checkbox">
                            <span>Remember Me</span>
                        </label>

                        <a href="#" class="forgot-password">
                            Forget Password?
                        </a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="login-btn" data-aos="fade-up" data-aos-delay="450">
                        <span>Login</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>

                    <!-- Divider -->
                    <div class="login-divider" data-aos="fade-up" data-aos-delay="550">
                        <span></span>
                        <p>or</p>
                        <span></span>
                    </div>

                    <!-- Google Login -->
                    <button type="button" class="google-login-btn" data-aos="fade-up" data-aos-delay="650">
                        <i class="bi bi-google"></i>
                        <span>Login with Google</span>
                    </button>

                    <!-- Signup --> 
                    <p class="signup-text" data-aos="fade-up" data-aos-delay="750">
                        Don't have an account?  
                        <a href="#">Sign Up</a>
                    </p>
                </form>
            </div>
                
            
        </section>


    </main>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
            AOS.init({
                duration : 1000,
                easing : "ease-in-out",
                once: true,
                offset : 100
            
            });
    </script>
</body>
</html>
