{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | HaritSena</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <!-- Register CSS -->
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>

<body>
    <main class="register-page">

        <!-- Left Side -->
        <section class="register-left" data-aos="fade-up" data-aos-duration="800">
            <div class="register-brand" data-aos="fade-up" data-aos-duration="800">
                <h2>🌱 HaritSena</h2>
                <p>Clean Today, Green Tomorrow</p>
            </div>

            <div class="register-welcome" data-aos="fade-up" data-aos-duration="800" data-aos-delay="150">
                <h1>Join the 
                    <span>Green Movement!</span>
                </h1>

                <div class="register-green-line"></div>

                <p>
                    Create your account and be a part of
                    building a cleaner, greener and
                    better tomorrow.
                </p>
            </div>
        </section>

        <!-- Right Side -->
        <section class="register-right">
            <div class="register-heading" data-aos="fade-left" data-aos-duration="900">
                <h1>
                    Create Your <span>Account</span>
                </h1>

                <p class="Register-subtitle">
                    Sign up to get started with <span>HaritSena</span>
                </p>

                <!-- Form -->
                <form class="register-form" autocomplete="off">
                    <!-- Full Name -->
                    <div class="form-group" data-aos="fade-up" data-aos-delay="150">
                        <label for="fullname">Full Name</label>

                        <div class="input-box">
                            <i class="bi bi-person"></i>

                            <input
                                type="text"
                                id="fullname"
                                name="fullname"
                                placeholder="Enter your ful name"
                                autocomplete="off">
                        </div>
                    </div>

                    <!-- Username -->
                    <div class="form-group">
                        <label for="username">
                            Username
                        </label>

                        <div class="input-box">
                            <i class="bi bi-person"></i>

                            <input type="text" id="username" name="username" placeholder="Choose a username" autocomplete="off">
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">
                            Email Address
                        </label>

                        <div class="input-box">
                            <i class="bi bi-envelope"></i>

                            <input type="email" id="email" name="email" placeholder="Enter your email address" autocomplete="off">
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group" data-aos="fade-up" data-aos-delay="250">
                        <label for="password">Password</label>

                        <div class="input-box">
                            <i class="bi bi-lock"></i>

                            <input type="password" id="password" placeholder="Create a password" autocomplete="new-password" name="password">

                            <i class="bi bi-eye password-toggle"></i>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="form-group" data-aos="fade-up" data-aos-delay="250">
                        <label for="confirm-password">Confirm Password</label>

                        <div class="input-box">
                            <i class="bi bi-lock"></i>

                            <input type="password" id="confirm-password" placeholder="Confirm your password" autocomplete="new-password" name="confirm_password">

                            <i class="bi bi-eye password-toggle"></i>
                        </div>
                    </div>

                    <!-- Terms -->
                    <div class="register-terms">
                        <label>
                            <input type="checkbox" name="term">
                            <span>I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a></span>
                        </label>
                    </div>

                    <!-- Create Account Button -->
                    <button type="submit" class="register-btn" data-aos="fade-up" data-aos-delay="450">
                        <span>Create Account</span>
                        <i class="bi bi-person-plus"></i>
                    </button>

                    <!-- Divider -->
                    <div class="register-divider" data-aos="fade-up" data-aos-delay="550">
                        <span></span>
                        <p>or</p>
                        <span></span>
                    </div>

                    <!-- Google register -->
                    <button type="button" class="google-register-btn" data-aos="fade-up" data-aos-delay="650">
                        <i class="bi bi-google"></i>
                        <span>Sign up with Google</span>
                    </button>

                    <!-- Login --> 
                    <p class="login-text" data-aos="fade-up" data-aos-delay="750">
                        Already have an account?  
                        <a href="#">Login</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
            AOS.init({
                duration : 1000,
                easing : "ease-in-out",
                once: true,
                offset : 100
            
            });
    </script>
</body>
